<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 36" shape-rendering="crispEdges">
  <!-- open pixel Pokedex, drawn on a 64x36 grid -->
  <!-- left half -->
  <rect x="5" y="2" width="27" height="32" fill="#5a0a10"/>
  <rect x="6" y="3" width="25" height="30" fill="#d4202a"/>
  <rect x="6" y="3" width="25" height="1" fill="#f25a5a"/>
  <rect x="6" y="12" width="25" height="1" fill="#8a1018"/>
  <!-- big blue lens -->
  <rect x="9" y="4" width="5" height="7" fill="#fff"/><rect x="8" y="5" width="7" height="5" fill="#fff"/>
  <rect x="10" y="5" width="3" height="5" fill="#2a6fe0"/><rect x="9" y="6" width="5" height="3" fill="#2a6fe0"/>
  <rect x="10" y="6" width="1" height="1" fill="#9fd0ff"/><rect x="12" y="8" width="1" height="1" fill="#174a9a"/>
  <!-- 3 little lights -->
  <rect x="17" y="5" width="2" height="2" fill="#ff5a5a"/><rect x="17" y="5" width="1" height="1" fill="#ffc2c2"/>
  <rect x="20" y="5" width="2" height="2" fill="#ffd500"/><rect x="20" y="5" width="1" height="1" fill="#fff2a0"/>
  <rect x="23" y="5" width="2" height="2" fill="#5fd41f"/><rect x="23" y="5" width="1" height="1" fill="#c8ffa0"/>
  <!-- screen -->
  <rect x="10" y="14" width="18" height="12" fill="#e8e8e8"/><rect x="9" y="15" width="20" height="10" fill="#e8e8e8"/>
  <rect x="11" y="16" width="16" height="8" fill="#2b3a2b"/>
  <!-- tiny ghost on the screen -->
  <rect x="17" y="17" width="4" height="1" fill="#8bac0f"/><rect x="16" y="18" width="6" height="4" fill="#8bac0f"/>
  <rect x="16" y="22" width="1" height="1" fill="#8bac0f"/><rect x="18" y="22" width="2" height="1" fill="#8bac0f"/><rect x="21" y="22" width="1" height="1" fill="#8bac0f"/>
  <rect x="17" y="19" width="1" height="1" fill="#2b3a2b"/><rect x="20" y="19" width="1" height="1" fill="#2b3a2b"/>
  <rect x="12" y="17" width="1" height="1" fill="#ff5a5a"/>
  <rect x="11" y="25" width="1" height="1" fill="#d4202a"/><rect x="24" y="25" width="3" height="1" fill="#555"/>
  <!-- buttons -->
  <rect x="9" y="28" width="3" height="3" fill="#1a1a1a"/><rect x="9" y="28" width="1" height="1" fill="#666"/>
  <rect x="14" y="27" width="4" height="1" fill="#ff8a8a"/><rect x="19" y="27" width="4" height="1" fill="#6ab0ff"/>
  <rect x="14" y="29" width="9" height="3" fill="#5fd41f"/><rect x="14" y="29" width="9" height="1" fill="#b8ff8a"/>
  <rect x="26" y="27" width="1" height="5" fill="#1a1a1a"/><rect x="24" y="29" width="5" height="1" fill="#1a1a1a"/>
  <!-- hinge -->
  <rect x="32" y="4" width="2" height="30" fill="#8a1018"/>
  <rect x="32" y="8" width="2" height="1" fill="#5a0a10"/><rect x="32" y="20" width="2" height="1" fill="#5a0a10"/><rect x="32" y="30" width="2" height="1" fill="#5a0a10"/>
  <!-- right half -->
  <rect x="34" y="7" width="26" height="27" fill="#5a0a10"/>
  <rect x="34" y="8" width="25" height="25" fill="#d4202a"/>
  <rect x="34" y="8" width="25" height="1" fill="#f25a5a"/>
  <rect x="37" y="11" width="19" height="6" fill="#1a1a1a"/>
  <rect x="38" y="13" width="9" height="1" fill="#5fd41f"/><rect x="38" y="15" width="5" height="1" fill="#5fd41f"/>
  <!-- blue button grid -->
  <g fill="#2a6fe0">
    <rect x="37" y="19" width="3" height="2"/><rect x="41" y="19" width="3" height="2"/><rect x="45" y="19" width="3" height="2"/><rect x="49" y="19" width="3" height="2"/><rect x="53" y="19" width="3" height="2"/>
    <rect x="37" y="22" width="3" height="2"/><rect x="41" y="22" width="3" height="2"/><rect x="45" y="22" width="3" height="2"/><rect x="49" y="22" width="3" height="2"/><rect x="53" y="22" width="3" height="2"/>
  </g>
  <g fill="#7fb6ff">
    <rect x="37" y="19" width="3" height="1"/><rect x="41" y="19" width="3" height="1"/><rect x="45" y="19" width="3" height="1"/><rect x="49" y="19" width="3" height="1"/><rect x="53" y="19" width="3" height="1"/>
    <rect x="37" y="22" width="3" height="1"/><rect x="41" y="22" width="3" height="1"/><rect x="45" y="22" width="3" height="1"/><rect x="49" y="22" width="3" height="1"/><rect x="53" y="22" width="3" height="1"/>
  </g>
  <rect x="37" y="26" width="8" height="1" fill="#e8e8e8"/><rect x="48" y="26" width="8" height="1" fill="#e8e8e8"/>
  <rect x="37" y="28" width="8" height="3" fill="#1a1a1a"/><rect x="48" y="28" width="8" height="3" fill="#1a1a1a"/>
  <rect x="53" y="29" width="2" height="1" fill="#ffd500"/>
</svg>
