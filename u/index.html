<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mentoxs Profile</title>
<meta name="description" content="A player profile from the Mentoxs Launcher: level, badges, photos and screenshots.">
<meta name="theme-color" content="#050506">
<link rel="icon" href="../images/launcher/icon.png">
<style>
  :root { --bg: #070708; --panel: rgba(14,14,17,.84); --line: #26262c; --line2: #34343c; --ink: #f2f2f4; --dim: #8b8b94; --dim2: #5c5c66; --ease: cubic-bezier(.2,.8,.2,1);
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; --display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
    --acc: linear-gradient(90deg,#f4f5f8,#8d919c 55%,#3a3c44); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; }
  img { display: block; max-width: 100%; }
  .sigil { width: 100%; height: 100%; overflow: visible; }
  button { font: inherit; color: inherit; }
  .chrome { background: linear-gradient(176deg, #fff 0%, #c9ccd4 38%, #fff 48%, #6c6f78 55%, #e7e9ee 72%, #9da1ab 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .dim { color: var(--dim); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  @keyframes drift { to { transform: scale(1.06) translate(-10px, 8px); } }
  @keyframes sweep { 0%, 60% { background-position: 150% 0; } 100% { background-position: -50% 0; } }
  @keyframes hover { 50% { transform: translateY(-6px) rotate(3deg); } }
  @keyframes beat { 50% { opacity: .35; } }
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes run { to { --a: 360deg; } }

  .top { position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; width: min(1040px, 100% - 32px); margin: 0 auto; padding: 18px 0; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 700 15px var(--display); letter-spacing: .3em; }
  .brand i { width: 28px; height: 28px; }
  .get { text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 13px; color: #000; background: linear-gradient(180deg, #fff, #d9dbe1 48%, #b9bcc5 52%, #f3f4f7); }

  .bg { position: absolute; left: 0; right: 0; top: 0; height: 720px; overflow: hidden; pointer-events: none; }
  .bg-img { position: absolute; inset: -20px; background: #050506 center top / cover no-repeat; animation: drift 40s ease-in-out infinite alternate; filter: grayscale(.7) brightness(.9); }
  .bg.custom .bg-img { filter: none; }
  .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,7,8,.15), rgba(7,7,8,.55) 50%, var(--bg) 96%); }
  .bg-sig { position: absolute; right: 5%; top: 60px; width: 460px; height: 460px; opacity: .25; animation: spin 120s linear infinite; }

  .pf { position: relative; z-index: 2; width: min(1040px, 100% - 32px); margin: 10px auto 60px; }
  .head { display: grid; grid-template-columns: auto 1fr 240px; gap: 30px; padding: 30px; border-radius: 12px; background: rgba(10,10,12,.62); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(14px); animation: rise .6s var(--ease); }
  .ava { position: relative; width: 168px; height: 168px; }
  .ava > img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; border-radius: 4px; background: #1a1a1f; box-shadow: 0 0 0 2px #fff, 0 0 30px rgba(255,255,255,.25); }
  .ava .halo { position: absolute; inset: -34px; z-index: 0; opacity: .85; animation: spin 26s linear infinite; filter: drop-shadow(0 0 12px rgba(255,255,255,.5)); }
  .ava.chrome-f .ring { position: absolute; inset: -7px; z-index: 2; border-radius: 8px; padding: 3px; background: conic-gradient(from var(--a), transparent 0 70%, #fff 80%, transparent 90%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: run 3.2s linear infinite; }
  .name { display: flex; align-items: center; gap: 12px; }
  .name b { font: 600 32px/1.15 var(--display); word-break: break-word; }
  .dot { width: 10px; height: 10px; flex: none; border-radius: 50%; background: #44444c; }
  .dot.on { background: #fff; box-shadow: 0 0 10px #fff; }
  .dot.play { background: #fff; box-shadow: 0 0 12px #fff; animation: beat 1.3s infinite; }
  .real { color: var(--dim); font-size: 13px; }
  .bio { margin: 14px 0 0; color: #cfcfd5; white-space: pre-wrap; word-break: break-word; }
  .rx { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  .rx span { display: inline-flex; gap: 5px; align-items: center; height: 30px; padding: 0 10px; border-radius: 15px; background: rgba(255,255,255,.05); border: 1px solid var(--line2); font-size: 15px; }
  .rx span i { font-style: normal; font-size: 12px; font-weight: 600; }
  .side { display: flex; flex-direction: column; gap: 14px; }
  .level { display: flex; align-items: center; gap: 12px; font: 600 20px var(--display); }
  .level i { font-style: normal; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; font-size: 17px; border: 2px solid #fff; box-shadow: 0 0 18px rgba(255,255,255,.4); }
  .lvbar { height: 4px; border-radius: 4px; background: #232329; overflow: hidden; }
  .lvbar i { display: block; height: 100%; background: #fff; box-shadow: 0 0 10px #fff; width: 0; transition: width 1.2s var(--ease); }
  .feat { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 8px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
  .feat b { display: block; font-size: 13px; }
  .feat span { font-size: 12px; color: var(--dim); }
  .bic { width: 44px; height: 44px; flex: none; filter: drop-shadow(0 0 6px rgba(255,255,255,.35)); }
  .pic { display: block; width: 100%; height: 100%; border-radius: 50%; padding: 3px; background: conic-gradient(from var(--a), #fff, #6c6f78, #fff, #3a3c44, #fff); animation: run 4s linear infinite; }
  .pic img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #000; }

  .cols { display: grid; grid-template-columns: 1fr 240px; gap: 18px; margin-top: 18px; }
  .main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .sc { border-radius: 10px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); animation: rise .6s var(--ease) both; }
  .sc-h { position: relative; display: flex; justify-content: space-between; padding: 8px 14px; font: 600 15px var(--display); color: #000; background: var(--acc); overflow: hidden; }
  .sc-h::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); background-size: 300% 100%; animation: sweep 6s ease-in-out infinite; }
  .sc-h small { font: 500 12px var(--font); opacity: .75; position: relative; z-index: 1; }
  .empty { padding: 16px; color: var(--dim); font-size: 13px; }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 14px; }
  .bd { text-align: center; padding: 12px 6px; border-radius: 8px; background: rgba(255,255,255,.03); border: 1px solid var(--line); }
  .bd .bic { width: 54px; height: 54px; margin: 0 auto 8px; animation: hover 6s ease-in-out infinite; }
  .bd b { font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; padding: 14px; }
  .grid.wide { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .tile { position: relative; aspect-ratio: 1; padding: 0; border-radius: 6px; overflow: hidden; border: 1px solid var(--line2); background: #111; cursor: zoom-in; transition: transform .25s var(--ease), border-color .2s; }
  .grid.wide .tile { aspect-ratio: 16 / 9; }
  .tile:hover { transform: translateY(-3px); border-color: #fff; }
  .tile img { width: 100%; height: 100%; object-fit: cover; }
  .tile span { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 6px 4px; font-size: 9px; font-weight: 700; letter-spacing: .16em; text-align: center; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.85)); }
  .cm { display: grid; grid-template-columns: 32px 1fr; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .cm:first-child { border-top: 0; }
  .cm img { width: 32px; height: 32px; border-radius: 4px; object-fit: cover; background: #1a1a1f; }
  .cm b { font-size: 13px; } .cm small { margin-left: 8px; font-size: 11px; color: var(--dim2); }
  .cm p { margin: 2px 0 0; font-size: 13px; color: #d8d8dd; white-space: pre-wrap; word-break: break-word; }
  .aside { align-self: start; padding: 16px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); animation: rise .6s .1s var(--ease) both; }
  .st { padding-bottom: 12px; margin-bottom: 6px; border-bottom: 1px solid var(--line); font: 600 17px var(--display); color: var(--dim); }
  .st.on { color: #fff; text-shadow: 0 0 12px rgba(255,255,255,.4); }
  .st small { display: block; font: 400 12px var(--font); color: var(--dim); }
  .row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; color: var(--dim); }
  .row i { font-style: normal; color: var(--ink); }
  .cta { margin-top: 14px; padding: 14px; border-radius: 8px; border: 1px dashed #fff4; font-size: 13px; color: var(--dim); text-align: center; }
  .cta a { display: inline-block; margin-top: 8px; }
  .lb { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(0,0,0,.92); cursor: zoom-out; }
  .lb img { max-width: 92vw; max-height: 84vh; border-radius: 8px; }
  .lb p { position: absolute; bottom: 4%; left: 0; right: 0; text-align: center; color: #ddd; }
  .msg { position: relative; z-index: 2; text-align: center; padding: 120px 20px; }
  .msg .s { width: 160px; height: 160px; margin: 0 auto 20px; animation: spin 30s linear infinite; }
  .msg h1 { font: 600 30px var(--display); margin: 0 0 8px; }
  @media (max-width: 820px) {
    .head { grid-template-columns: 1fr; text-align: center; justify-items: center; }
    .name { justify-content: center; }
    .rx { justify-content: center; }
    .side { width: 100%; }
    .cols { grid-template-columns: 1fr; }
    .ava { width: 140px; height: 140px; }
  }
</style>
</head>
<body>
<div class="bg" id="bg"><div class="bg-img" id="bgImg"></div><div class="bg-sig" id="bgSig"></div></div>
<header class="top">
  <a class="brand" href="../launcher/"><i id="brandSig"></i><span class="chrome">MENTOXS</span></a>
  <span><a class="get" href="../players/" style="background:none;color:#fff;border:1px solid #fff5;margin-right:8px">All players</a><a class="get" href="../launcher/">Get the launcher</a></span>
</header>
<main id="app"><div class="msg"><div class="s" id="loadSig"></div><p class="dim">Loading profile...</p></div></main>

<script src="../launcher/sigils.js"></script>
<script>
(function () {
  'use strict';
  // Public profile pages: mentoxs.github.io/u/?name  (read straight from the launcher's database, read-only)
  var KEY = 'AIzaSyDhbW5P_c3ndEcHsnaJAG9f-XW05Gn4GSQ';
  var DB = 'https://firestore.googleapis.com/v1/projects/mentoxs-launcher/databases/(default)/documents/';
  var SG = function (seed, o) { return Sigils.svg(Object.assign({ seed: seed }, o || {})); };
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var AVA = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#141418"/><circle cx="32" cy="25" r="11" fill="#d9dbe1"/><path d="M12 60c2-14 11-20 20-20s18 6 20 20z" fill="#d9dbe1"/></svg>');
  var BADGES = {
    owner: { n: 'Owner', d: 'Creator of Mentoxs and its games', img: '../launcher/owner.jpg' },
    first: { n: 'First steps', d: 'Installed a game', s: 2 }, regular: { n: 'Cabin regular', d: 'Played for an hour', s: 7 },
    kiko: { n: 'Kiko hunter', d: 'Found all 7 photos of Kiko', s: 11 }, night: { n: 'The whole night', d: 'Reached every chapter of CHATA', s: 9 },
    friend: { n: 'Friend of the dev', d: 'Handed out by Mentoxs', s: 13 }, beta: { n: 'Beta tester', d: 'Was here before 2027', s: 17 },
    halloween26: { n: 'Halloween 2026', d: 'Opened the launcher during Halloween 2026', s: 21 }
  };
  var ACCENTS = { chrome: 'linear-gradient(90deg,#f4f5f8,#8d919c 55%,#3a3c44)', ice: 'linear-gradient(90deg,#e9fdff,#5cc7e6 60%,#11384a)', blood: 'linear-gradient(90deg,#ff4a4a,#8a0b0b 60%,#200)',
    toxic: 'linear-gradient(90deg,#d6ff47,#4c8f00 60%,#0d2000)', violet: 'linear-gradient(90deg,#e46bff,#ff5fb0 55%,#ffc94a)', void: 'linear-gradient(90deg,#3a3a44,#121216)' };
  var BG_IMG = { road: 'road', mirror: 'mirror', forest: 'forest', knock: 'knock' };

  $('#brandSig').innerHTML = SG(3);
  $('#loadSig').innerHTML = SG(5, { glow: true });

  // Firestore REST values -> plain JS
  function val(v) {
    if (!v) return null;
    if ('stringValue' in v) return v.stringValue;
    if ('integerValue' in v) return +v.integerValue;
    if ('doubleValue' in v) return v.doubleValue;
    if ('booleanValue' in v) return v.booleanValue;
    if ('timestampValue' in v) return Date.parse(v.timestampValue);
    if ('arrayValue' in v) return (v.arrayValue.values || []).map(val);
    if ('mapValue' in v) return fields(v.mapValue.fields || {});
    return null;
  }
  function fields(f) { var o = {}; for (var k in f) o[k] = val(f[k]); return o; }
  function get(path) {
    return fetch(DB + path + (path.indexOf('?') < 0 ? '?' : '&') + 'key=' + KEY).then(function (r) {
      if (r.status === 403) throw new Error('private');
      return r.ok ? r.json() : null;
    });
  }
  function list(path, order, n) {
    return get(path + '?pageSize=' + n + '&orderBy=' + encodeURIComponent(order)).then(function (j) {
      return ((j && j.documents) || []).map(function (d) { var o = fields(d.fields || {}); o.id = d.name.split('/').pop(); return o; });
    }).catch(function () { return []; });
  }
  function musicEmbed(u) {
    u = String(u || '').trim(); var m;
    if ((m = u.match(/open\.spotify\.com\/(?:intl-\w+\/)?(track|album|playlist|episode|artist)\/([A-Za-z0-9]+)/))) return { src: 'https://open.spotify.com/embed/' + m[1] + '/' + m[2] + '?theme=0', h: 152 };
    if ((m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/|music\.youtube\.com\/watch\?v=)([\w-]{11})/))) return { src: 'https://www.youtube-nocookie.com/embed/' + m[1], h: 300 };
    if (/^https:\/\/(on\.|www\.|m\.)?soundcloud\.com\//.test(u)) return { src: 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(u) + '&color=%23ffffff&visual=true', h: 166 };
    return null;
  }
  function levelOf(xp) { var level = 1, base = 0, need = 100; while (xp >= base + need) { base += need; level++; need = 100 * Math.ceil(level / 10); } return { level: level, into: xp - base, need: need }; }
  function hours(s) { s = s || 0; var h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return h ? h + ' h ' + m + ' min' : m + ' min'; }
  function ago(t) { if (!t) return ''; var d = (Date.now() - t) / 1000; if (d < 3600) return Math.max(1, Math.round(d / 60)) + ' min ago'; if (d < 86400) return Math.round(d / 3600) + ' h ago'; return new Date(t).toLocaleDateString(); }
  function badgeIcon(id, glow) { var b = BADGES[id]; return b.img ? '<span class="pic"><img alt="" src="' + b.img + '"></span>' : SG(b.s, { glow: glow }); }
  function fail(title, text) { $('#app').innerHTML = '<div class="msg"><div class="s">' + SG(9, { glow: true }) + '</div><h1>' + esc(title) + '</h1><p class="dim">' + esc(text) + '</p><p><a class="get" href="../launcher/">Get the Mentoxs Launcher</a></p></div>'; }
  function lightbox(src, cap) {
    var d = document.createElement('div'); d.className = 'lb';
    d.innerHTML = '<img alt=""><p></p>'; d.querySelector('img').src = src; d.querySelector('p').textContent = cap || '';
    d.onclick = function () { d.remove(); }; document.body.appendChild(d);
  }

  var name = decodeURIComponent((location.search.slice(1) || location.hash.slice(1) || '').split('&')[0]).trim().toLowerCase();
  if (!name) { fail('Whose profile?', 'Open a profile link like mentoxs.github.io/u/?mentoxs'); return; }

  get('usernames/' + encodeURIComponent(name)).then(function (u) {
    if (!u || !u.fields) { fail('Nobody called "' + name + '"', 'That player does not have a Mentoxs account (yet).'); return; }
    var uid = val(u.fields.uid);
    return Promise.all([get('users/' + uid), list('users/' + uid + '/shots', 'at desc', 40), list('users/' + uid + '/comments', 'at desc', 20), list('users/' + uid + '/reactions', 'at desc', 100)])
      .then(function (r) { render(fields((r[0] && r[0].fields) || {}), r[1], r[2], r[3]); });
  }).catch(function (e) {
    if (e && e.message === 'private') fail('Profiles are not public yet', 'Public profile pages are switched on soon. Check back in a bit.');
    else fail('Could not load the profile', 'Check your internet connection and try again.');
  });

  function render(p, shots, comments, reacts) {
    document.title = p.name + ' · Mentoxs';
    document.documentElement.style.setProperty('--acc', ACCENTS[p.accent] || ACCENTS.chrome);
    var bgImg = p.bg || (BG_IMG[p.bgPreset] ? '../images/chata/' + BG_IMG[p.bgPreset] + '.jpg' : '');
    if (bgImg) $('#bgImg').style.backgroundImage = 'url("' + bgImg + '")';
    if (p.bg) $('#bg').classList.add('custom');
    if (!bgImg) $('#bgSig').innerHTML = SG((p.sigil || 3) + 20, { glow: true });
    var online = p.status !== 'offline' && p.lastSeen && Date.now() - p.lastSeen < 180000;
    var badges = (p.badges || []).filter(function (b) { return BADGES[b]; });
    var feat = p.featured && badges.indexOf(p.featured) >= 0 ? p.featured : badges[0];
    var L = levelOf(p.xp || 0);
    var counts = {}; reacts.forEach(function (x) { counts[x.e] = (counts[x.e] || 0) + 1; });
    var inv = shots.filter(function (s) { return s.kind !== 'screenshot'; }), scr = shots.filter(function (s) { return s.kind === 'screenshot'; });
    var games = p.games || [];

    var h = '<section class="pf"><div class="head">' +
      '<div class="ava ' + (p.frame === 'chrome' ? 'chrome-f' : '') + '">' + (p.frame === 'sigil' || !p.frame ? '<div class="halo">' + SG(p.sigil || 3, { glow: true }) + '</div>' : '') + '<img alt="" src="' + esc(p.avatar || AVA) + '"><div class="ring"></div></div>' +
      '<div><div class="name"><b>' + esc(p.name) + '</b><span class="dot ' + (online ? (p.status === 'playing' ? 'play' : 'on') : '') + '"></span></div>' +
      '<div class="real">' + esc([p.realName, p.mood].filter(Boolean).join('  ·  ')) + '</div>' +
      '<p class="bio">' + esc(p.bio || '') + '</p>' +
      '<div class="rx">' + Object.keys(counts).map(function (e) { return '<span>' + esc(e) + '<i>' + counts[e] + '</i></span>'; }).join('') + '</div></div>' +
      '<div class="side"><div class="level">Level <i>' + (p.level || L.level) + '</i></div><div class="lvbar"><i id="lv"></i></div><span class="dim" style="font-size:12px">' + (p.xp || 0) + ' XP</span>' +
      (feat ? '<div class="feat"><div class="bic">' + badgeIcon(feat, true) + '</div><div><b>' + esc(BADGES[feat].n) + '</b><span>' + esc(BADGES[feat].d) + '</span></div></div>' : '') + '</div></div>' +
      '<div class="cols"><div class="main">';
    var mus = musicEmbed(p.music);
    if (mus) h += '<div class="sc"><div class="sc-h">Currently obsessed with:</div><iframe style="display:block;width:100%;border:0" src="' + esc(mus.src) + '" height="' + mus.h + '" allow="autoplay; clipboard-write; encrypted-media; fullscreen" loading="lazy"></iframe></div>';
    if (badges.length) h += '<div class="sc"><div class="sc-h">Badges<small>' + badges.length + '</small></div><div class="badges">' + badges.map(function (b) { return '<div class="bd" title="' + esc(BADGES[b].d) + '"><div class="bic">' + badgeIcon(b, true) + '</div><b>' + esc(BADGES[b].n) + '</b></div>'; }).join('') + '</div></div>';
    h += '<div class="sc"><div class="sc-h">Inventory<small>' + inv.length + ' items</small></div>' + (inv.length ? '<div class="grid" id="inv"></div>' : '<div class="empty">Nothing in here yet.</div>') + '</div>';
    h += '<div class="sc"><div class="sc-h">Screenshots<small>' + scr.length + '</small></div>' + (scr.length ? '<div class="grid wide" id="scr"></div>' : '<div class="empty">No screenshots yet.</div>') + '</div>';
    if (games.length) h += '<div class="sc"><div class="sc-h">Recent Activity</div>' + games.map(function (g) { return '<div class="row" style="padding:10px 14px"><span><b style="color:#fff">' + esc(g.name) + '</b></span><i>' + hours(g.play) + ' on record</i></div>'; }).join('') + '</div>';
    h += '<div class="sc"><div class="sc-h">Comments<small>' + comments.length + '</small></div>' + (comments.length ? comments.map(function (c) {
      return '<div class="cm"><img alt="" src="' + esc(c.avatar || AVA) + '"><div><b>' + esc(c.name || 'someone') + '</b><small>' + ago(c.at) + '</small><p>' + esc(c.text) + '</p></div></div>'; }).join('') : '<div class="empty">No comments yet.</div>') + '</div>';
    h += '</div><aside class="aside"><div class="st ' + (online ? 'on' : '') + '">' + (online ? (p.status === 'playing' && p.game ? 'Currently In-Game<small>' + esc(p.game) + '</small>' : 'Currently Online') : 'Currently Offline') + '</div>' +
      '<div class="row"><span>Play time</span><i>' + hours(p.playSeconds) + '</i></div>' +
      '<div class="row"><span>Badges</span><i>' + badges.length + '</i></div>' +
      '<div class="row"><span>Kiko photos</span><i>' + (p.kiko || 0) + ' / 7</i></div>' +
      '<div class="row"><span>Chapters</span><i>' + (p.chapters || 0) + ' / 13</i></div>' +
      '<div class="cta">Add ' + esc(p.name) + ' as a friend in the Mentoxs Launcher.<br><a class="get" href="../launcher/">Get the launcher</a></div></aside></div></section>';
    $('#app').innerHTML = h;
    requestAnimationFrame(function () { $('#lv').style.width = Math.round(L.into / L.need * 100) + '%'; });
    function tiles(el, items) {
      if (!el) return;
      items.forEach(function (s) {
        var t = document.createElement('button'); t.className = 'tile'; t.title = s.title || '';
        t.innerHTML = '<img alt="" loading="lazy">' + (s.kind === 'screenshot' ? '' : '<span>' + (s.kind === 'kiko' ? 'KIKO' : 'PHOTO') + '</span>');
        t.querySelector('img').src = s.img;
        t.onclick = function () { lightbox(s.img, s.title); };
        el.appendChild(t);
      });
    }
    tiles($('#inv'), inv); tiles($('#scr'), scr);
  }
})();
</script>
</body>
</html>
